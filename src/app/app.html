<nav class="navbar">
  <div class="navbar-left">
    <a routerLink="/" class="logo">
      <img src="/images/myLogo.jpg" alt="Calbernía Grounds Maintenance Logo" />
    </a>
  </div>
  <div class="navbar-right">
    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="nav-links" [class.open]="menuOpen()">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()"
      >
        Home
      </a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()"> About </a>
      <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()"> Services </a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()"> Contact </a>
      <a routerLink="/contact" class="quote-button" (click)="closeMenu()">
        Get a Quote
        <span>→</span>
      </a>
    </div>
  </div>
</nav>
<main class="page-content">
  <router-outlet></router-outlet>
</main>
<footer class="footer">
  <div class="footer-content">
    <div class="footer-brand">
      <strong>Calbernía</strong>
      <span>Grounds Maintenance</span>
    </div>
    <div class="footer-divider"></div>
    <p>© {{ currentYear }} Calbernía Grounds Maintenance. All rights reserved.</p>
  </div>
</footer>
